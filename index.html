<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anchita</title>
  <meta name="description" content="Anchita — a company by Anchita LLC. In active development.">
  <link rel="canonical" href="https://anchita.ai/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://anchita.ai/">
  <meta property="og:title" content="Anchita">
  <meta property="og:description" content="A company by Anchita LLC. In active development.">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#07090e">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..500;1,9..144,300..500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <style>
    :root{
      --ink:#07090e; --ink-deep:#04060a;
      --text:#eef1f6; --muted:#8b97ac; --faint:#5a6577;
      --accent:#46b6f2; --accent-soft:rgba(70,182,242,.5);
      --cobalt:#3a55e8;
      --hair:rgba(255,255,255,.10);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; background:var(--ink); color:var(--text);
      font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
      min-height:100svh; overflow-x:hidden;
    }
    #flow{position:fixed; inset:0; width:100%; height:100%; z-index:0; display:block;}
    .veil{position:fixed; inset:0; z-index:1; pointer-events:none;
      background:
        radial-gradient(115% 88% at 50% 42%, transparent 0%, transparent 38%, rgba(4,6,10,.58) 100%),
        linear-gradient(to bottom, rgba(4,6,10,.55) 0%, transparent 20%, transparent 66%, rgba(4,6,10,.9) 100%);
    }
    .page{position:relative; z-index:2; min-height:100svh; display:flex; flex-direction:column;}
    .stage{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
      text-align:center; padding:72px 24px 44px;}
    .eyebrow{font-size:12px; letter-spacing:.36em; text-transform:uppercase; color:var(--faint);
      margin:0 0 30px; font-weight:500;}
    .logo{width:clamp(78px,12vw,116px); height:auto; display:block; margin:0 0 28px;
      filter:drop-shadow(0 6px 34px rgba(58,85,232,.32));}
    .wordmark{font-family:"Fraunces",Georgia,serif; font-weight:360; font-optical-sizing:auto;
      font-size:clamp(58px,14vw,140px); line-height:.9; letter-spacing:-.012em; margin:0; color:var(--text);}
    .wordmark .tm{font-family:"IBM Plex Sans",sans-serif; font-size:.15em; vertical-align:super;
      letter-spacing:0; color:var(--accent); font-weight:400; margin-left:.05em;}
    .rule{width:52px; height:1px; background:var(--accent); opacity:.85; margin:34px 0 34px;}
    .status{display:inline-flex; align-items:center; gap:9px;
      font-size:11.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted);
      border:1px solid var(--hair); border-radius:999px; padding:9px 16px 9px 14px;
      background:rgba(255,255,255,.02);}
    .status .dot{width:6px; height:6px; border-radius:50%; background:var(--accent);
      box-shadow:0 0 0 0 var(--accent-soft); animation:pulse 2.8s ease-out infinite;}
    @keyframes pulse{
      0%{box-shadow:0 0 0 0 rgba(70,182,242,.5)}
      70%{box-shadow:0 0 0 9px rgba(70,182,242,0)}
      100%{box-shadow:0 0 0 0 rgba(70,182,242,0)}
    }
    .legal{padding:22px 24px 30px; text-align:center; border-top:1px solid var(--hair);
      display:flex; flex-direction:column; gap:5px;
      background:linear-gradient(to bottom, transparent, rgba(4,6,10,.55));}
    .legal p{margin:0; font-size:11.5px; letter-spacing:.04em; color:var(--faint); line-height:1.55;}
    .legal .mark{color:var(--muted);}
    @media (prefers-reduced-motion:reduce){ .status .dot{animation:none} }
    @media (max-width:520px){ .eyebrow{margin-bottom:24px; letter-spacing:.3em} }
  </style>
</head>
<body>
  <canvas id="flow" aria-hidden="true"></canvas>
  <div class="veil" aria-hidden="true"></div>

  <div class="page">
    <main class="stage">
      <p class="eyebrow">Established 2026</p>

      <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Anchita logo">
        <defs>
          <linearGradient id="agL" x1="0%" y1="100%" x2="70%" y2="0%">
            <stop offset="0%" stop-color="#282252"/>
            <stop offset="35%" stop-color="#3A55E8"/>
            <stop offset="68%" stop-color="#00BAFA"/>
            <stop offset="85%" stop-color="#A5F3FC"/>
            <stop offset="100%" stop-color="#FFFFFF"/>
          </linearGradient>
          <linearGradient id="agR" x1="100%" y1="100%" x2="30%" y2="0%">
            <stop offset="0%" stop-color="#282252"/>
            <stop offset="35%" stop-color="#3A55E8"/>
            <stop offset="68%" stop-color="#00BAFA"/>
            <stop offset="85%" stop-color="#A5F3FC"/>
            <stop offset="100%" stop-color="#FFFFFF"/>
          </linearGradient>
        </defs>
        <path d="M22 76 C30 76, 38 34, 49.3 20 L 49.3 26 C40 34, 32 60, 36 67 C40 63, 45 49, 50 49 L 50 42 C41 52, 36 67, 36 67 L 22 76 Z" fill="url(#agL)"/>
        <path d="M78 76 C70 76, 62 34, 50.7 20 L 50.7 26 C60 34, 68 60, 64 67 C60 63, 55 49, 50 49 L 50 42 C59 52, 64 67, 64 67 L 78 76 Z" fill="url(#agR)"/>
      </svg>

      <h1 class="wordmark">Anchita<span class="tm">&trade;</span></h1>
      <div class="rule" aria-hidden="true"></div>
      <div class="status"><span class="dot" aria-hidden="true"></span> In active development</div>
    </main>
    <footer class="legal">
      <p class="mark">ANCHITA&trade; is a trademark of Anchita LLC &middot; U.S. trademark application pending</p>
      <p>&copy; 2026 Anchita LLC &middot; All rights reserved</p>
    </footer>
  </div>

  <script>
    (function(){
      const cv = document.getElementById('flow');
      const ctx = cv.getContext('2d');
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const INK = '#07090e';
      let W, H, DPR, parts = [], t = 0, raf = 0;

      function newPart(){
        return { x: Math.random()*W, y: Math.random()*H, life: 0,
          max: 140 + Math.random()*220,
          tone: Math.random() < 0.6 ? 'c' : 'b',
          w: (0.5 + Math.random()*0.7) * DPR };
      }
      function initParts(){
        const n = Math.round((innerWidth*innerHeight)/16000);
        parts = [];
        const count = Math.min(Math.max(n, 60), 200);
        for(let i=0;i<count;i++) parts.push(newPart());
      }
      function resize(){
        DPR = Math.min(window.devicePixelRatio||1, 2);
        W = cv.width = Math.floor(innerWidth*DPR);
        H = cv.height = Math.floor(innerHeight*DPR);
        cv.style.width = innerWidth+'px';
        cv.style.height = innerHeight+'px';
        ctx.fillStyle = INK; ctx.fillRect(0,0,W,H);
        initParts();
      }
      function field(x,y,tt){
        const s = 0.0012;
        return Math.sin(x*s + tt)*1.1
             + Math.cos(y*s*1.15 - tt*0.6)*0.9
             + Math.sin((x+y)*s*0.6 + tt*0.4)*0.7;
      }
      function step(){
        ctx.fillStyle = 'rgba(7,9,14,0.055)';
        ctx.fillRect(0,0,W,H);
        t += 0.0016;
        for(const p of parts){
          const a = field(p.x, p.y, t) * Math.PI;
          const nx = p.x + Math.cos(a)*1.1*DPR;
          const ny = p.y + Math.sin(a)*1.1*DPR;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y); ctx.lineTo(nx, ny);
          ctx.lineWidth = p.w;
          ctx.strokeStyle = p.tone === 'c'
            ? 'rgba(70,182,242,0.15)' : 'rgba(58,85,232,0.13)';
          ctx.stroke();
          p.x = nx; p.y = ny; p.life++;
          if(p.life > p.max || p.x < 0 || p.x > W || p.y < 0 || p.y > H) Object.assign(p, newPart());
        }
      }
      function warm(frames){ for(let i=0;i<frames;i++) step(); }
      function loop(){ step(); raf = requestAnimationFrame(loop); }

      resize();
      if(reduce){ warm(420); }
      else { warm(160); loop(); }
      window.addEventListener('resize', function(){
        cancelAnimationFrame(raf); resize();
        if(!reduce){ warm(120); loop(); }
      });
    })();
  </script>
</body>
</html>
